name: Build ApplePie APK

on:
  push:
    paths:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p project
          unzip -o ApplePieAndroid_Project.zip -d project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and Build APK
        run: |
          echo "Searching for Gradle wrapper..."
          GRADLEW=$(find project -type f -name gradlew -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found!"
            echo "Project files:"
            find project -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Found Gradle wrapper: $GRADLEW"

          chmod +x "$GRADLEW"
          cd "$(dirname "$GRADLEW")"

          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ApplePie-debug-apk
          path: project/**/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
